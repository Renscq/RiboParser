name: conda-build

on:
  push:
    tags:
      - "v0.3.5"
  workflow_dispatch:

jobs:
  build:
    name: Build and upload conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract package version from pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package source tarball from the checked-out repository
        run: |
          mkdir -p dist/conda-src
          git archive --format=tar.gz --prefix="riboparser-${PACKAGE_VERSION}/" \
            -o "dist/conda-src/riboparser-${PACKAGE_VERSION}.tar.gz" HEAD
          echo "PACKAGE_URL=file://${GITHUB_WORKSPACE}/dist/conda-src/riboparser-${PACKAGE_VERSION}.tar.gz" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA256=$(sha256sum "dist/conda-src/riboparser-${PACKAGE_VERSION}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Set up micromamba with conda-build
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: conda-build
          create-args: >-
            conda-build
            anaconda-client
            conda-verify

      - name: Build conda package
        shell: bash -l {0}
        run: conda-build -c conda-forge -c bioconda --output-folder dist/conda recipe

      - name: Upload to anaconda.org
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -z "$ANACONDA_TOKEN" ]; then
            echo "::error::ANACONDA_TOKEN secret is empty. Please set it in Settings > Secrets."
            exit 1
          fi
          echo "ANACONDA_TOKEN length: ${#ANACONDA_TOKEN}"
          anaconda -t "$ANACONDA_TOKEN" upload --skip-existing dist/conda/noarch/*.conda
