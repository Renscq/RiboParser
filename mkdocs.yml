site_name: RiboParser
site_description: Documentation for RiboParser
site_author: Shuchao Ren
site_url: https://renscq.github.io/RiboParser/
repo_url: https://github.com/Renscq/RiboParser
repo_name: Renscq/RiboParser
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - "1. Overview": overview.md

  - "2. Installation":

      - "2 Installation overview": installation/index.md

      - "2.1 conda / micromamba": installation/conda.md

      - "2.2 pip": installation/pip.md

      - "2.3 GitHub": installation/github.md

  - "3. Quick start": quick-start.md

  - "4. Workflow":

