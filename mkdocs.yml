site_name: RiboParser
site_description: Documentation for RiboParser
site_author: Shuchao Ren
site_url: https://renscq.github.io/RiboParser/
repo_url: https://github.com/Renscq/RiboParser
repo_name: Renscq/RiboParser
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - Home: index.md
  - "1 Overview":
      - "1.1 Overview": overview/index.md
      - "1.2 Citation": overview/citation.md
      - "1.3 Suggested documentation layout": overview/documentation-layout.md
  - "2 Installation":
      - "2.1 pip": installation/pip.md
      - "2.2 conda": installation/conda.md
      - "2.3 GitHub": installation/github.md
  - "3 Quick start": quick-start.md
  - "4 Workflow":
      - "Workflow overview": workflow/index.md
      - "4.1 Reference preparation": workflow/reference-preparation.md
      - "4.2 Raw data download": workflow/raw-data-download.md
      - "4.3 Raw data cleaning": workflow/raw-data-cleaning.md
      - "4.4 Alignment and quantification": workflow/alignment-and-quantification.md
      - "4.5 Quality control":
          - "4.5 Quality control overview": workflow/quality-control/index.md
          - "4.5.1 Check": workflow/quality-control/check.md
          - "4.5.2 Enzymatic bias": workflow/quality-control/enzymatic-bias.md
          - "4.5.3 Offset table": workflow/quality-control/offset-table.md
          - "4.5.4 Read density": workflow/quality-control/read-density.md
          - "4.5.5 Merge density": workflow/quality-control/merge-density.md
          - "4.5.6 Periodicity": workflow/quality-control/periodicity.md
          - "4.5.7 Metaplot": workflow/quality-control/metaplot.md
          - "4.5.8 Coverage": workflow/quality-control/coverage.md
          - "4.5.9 Correlation": workflow/quality-control/correlation.md
      - "4.6 Gene-level analysis":
          - "4.6 Gene-level overview": workflow/gene-level/index.md
          - "4.6.1 Gene quantification": workflow/gene-level/quantification.md
          - "4.6.2 Gene coverage": workflow/gene-level/coverage.md
          - "4.6.3 Gene correlation": workflow/gene-level/correlation.md
          - "4.6.4 Gene density retrieval": workflow/gene-level/retrieve.md
      - "4.7 Codon-level analysis":
          - "4.7 Codon-level overview": workflow/codon-level/index.md
          - "4.7.1 Codon pausing score": workflow/codon-level/codon-pausing-score.md
          - "4.7.2 Codon occupancy": workflow/codon-level/codon-occupancy.md
          - "4.7.3 Codon decoding time": workflow/codon-level/codon-decoding-time.md
          - "4.7.4 Codon selection time": workflow/codon-level/codon-selection-time.md
          - "4.7.5 Coefficient of Variation": workflow/codon-level/coefficient-of-variation.md
          - "4.7.6 Meta-codon analysis": workflow/codon-level/meta-codon-analysis.md
          - "4.7.7 Codon odds ratio": workflow/codon-level/codon-odds-ratio.md
      - "4.8 smORF analysis":
          - "4.8 smORF overview": workflow/smorf/index.md
          - "4.8.1 smORF scanner": workflow/smorf/scanner.md
          - "4.8.2 smORF filter": workflow/smorf/filter.md
          - "4.8.3 smORF evidence": workflow/smorf/evidence.md
          - "4.8.4 smORF integrate": workflow/smorf/integrate.md
  - "5 Other toolkits":
