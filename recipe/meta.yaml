{% set version = os.environ.get("PACKAGE_VERSION", "0.3.5") %}

package:
  name: riboparser
  version: {{ version }}

source:
  git_url: https://github.com/renscq/RiboParser.git
  git_rev: v{{ version }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.12
    - numpy >=1.26
    - pandas >=2.2
    - pyarrow >=15
    - polars >=1.0
    - biopython >=1.83
    - scipy >=1.12
    - statsmodels >=0.14
    # pysam is provided by the bioconda channel (not conda-forge)
    - pysam >=0.23
    - joblib >=1.3
    - matplotlib-base >=3.8
    - matplotlib-venn >=1.1
    - seaborn >=0.13

test:
  commands:
    - riboparser --help

about:
  home: https://github.com/renscq/RiboParser
  license: GPL-3.0-or-later
  license_family: GPL3
  summary: A pipeline for ribosome profiling data analysis
  description: |
    RiboParser is a pipeline for comprehensive ribosome profiling
    (Ribo-seq) data analysis and visualization.
  dev_url: https://github.com/renscq/RiboParser

extra:
  recipe-maintainers:
    - renscq
